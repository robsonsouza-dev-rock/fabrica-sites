services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: bib01
      POSTGRES_PASSWORD: example
      POSTGRES_DB: biblioteca
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  adminer:
    image: adminer:6
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_PLUGINS: tables-filter sql-log table-indexes-structure table-structure
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: